<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu de la semaine</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <header>
    <h1>Menu de la semaine</h1>
    <button id="theme-toggle" aria-label="Passer en mode clair" title="Mode clair">☀️</button>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">☰</button>
    <nav id="nav-menu">
      <a href="index.html" class="active">Menu</a>
      <a href="courses.html">Liste de courses</a>
      <a href="recettes.html">Recettes</a>
    </nav>
  </header>

  <main>
    <p class="intro">
      Ajuste le nombre de personnes attendues pour chaque jour. Les modifications sont
      sauvegardées automatiquement et impactent la liste de courses et les quantités des plats.
    </p>

    <table id="menu-table">
      <thead>
        <tr>
          <th>Jour</th>
          <th>Midi</th>
          <th>Soir</th>
          <th>Personnes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="schema/repas-schema.js"></script>
  <script src="js/yaml-validator.js"></script>
  <script src="js/yaml-import.js"></script>
  <script src="js/yaml-share.js"></script>
  <script src="js/yaml-merge.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/popover.js"></script>
  <script src="js/recipe.js"></script>
  <script src="js/print-menu.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/nav.js"></script>
  <script>
    (async () => {
      try {
        if (window.YamlShare && YamlShare.applySharedYaml) {
          await YamlShare.applySharedYaml();
        }
      } catch (e) {
        console.warn('YamlShare init failed', e);
      }
      App.loadData()
        .then(Menu.renderMenu)
        .catch((err) => {
          const e = document.getElementById('error');
          e.hidden = false;
          e.textContent = 'Erreur de chargement : ' + err.message + ' (ouvre via un serveur HTTP, pas en file://)';
        });
    })();
  </script>
</body>
</html>
