<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu de la semaine</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Menu de la semaine</h1>
    <nav>
      <a href="index.html" class="active">Menu</a>
      <a href="courses.html">Liste de courses</a>
    </nav>
  </header>

  <main>
    <p class="intro">
      Ajuste le nombre de personnes attendues pour chaque jour. Les modifications sont
      sauvegardées automatiquement et impactent la liste de courses et les quantités des recettes.
    </p>

    <table id="menu-table">
      <thead>
        <tr>
          <th>Jour</th>
          <th>Midi</th>
          <th>Soir</th>
          <th>Personnes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/menu.js"></script>
  <script>
    App.loadData()
      .then(Menu.renderMenu)
      .catch((err) => {
        const e = document.getElementById('error');
        e.hidden = false;
        e.textContent = 'Erreur de chargement : ' + err.message + ' (ouvre via un serveur HTTP, pas en file://)';
      });
  </script>
</body>
</html>
