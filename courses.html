<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liste de courses</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Liste de courses</h1>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">☰</button>
    <nav id="nav-menu">
      <a href="index.html">Menu</a>
      <a href="courses.html" class="active">Liste de courses</a>
    </nav>
  </header>

  <main>
    <p class="intro">
      Quantités agrégées et groupées par catégorie pour tous les repas de la semaine,
      calculées à partir du nombre de personnes défini sur la page Menu.
    </p>
    <button id="print-btn" onclick="window.print()">Imprimer</button>
    <div id="courses-root"></div>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/popover.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/nav.js"></script>
  <script>
    App.loadData()
      .then(Courses.renderCourses)
      .catch((err) => {
        const e = document.getElementById('error');
        e.hidden = false;
        e.textContent = 'Erreur de chargement : ' + err.message;
      });
  </script>
</body>
</html>
