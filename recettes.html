<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recettes</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <header>
    <h1>Recettes</h1>
    <button id="theme-toggle" aria-label="Passer en mode clair" title="Mode clair">☀️</button>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">☰</button>
    <nav id="nav-menu">
      <a href="index.html">Menu</a>
      <a href="courses.html">Liste de courses</a>
      <a href="recettes.html" class="active">Recettes</a>
    </nav>
  </header>

  <main>
    <p class="intro">
      Toutes les recettes disponibles. Clique une carte pour voir le détail, ou utilise les boutons pour modifier ou supprimer une recette personnelle.
    </p>

    <div id="recipes-actions">
      <button id="create-recipe-btn" type="button">+ Créer une recette</button>
      <button id="scan-recipe-btn" type="button">📷 Scanner une recette</button>
    </div>

    <div id="recipes-grid"></div>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/popover.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/similar-recipe.js"></script>
  <script src="js/scan-recipe.js"></script>
  <script src="js/yaml-validator.js"></script>
  <script src="js/yaml-import.js"></script>
  <script src="js/yaml-share.js"></script>
  <script src="js/yaml-merge.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/nav.js"></script>
  <script>
    App.loadData()
      .then(Recipes.render)
      .catch((err) => {
        const e = document.getElementById('error');
        e.hidden = false;
        e.textContent = 'Erreur de chargement : ' + err.message;
      });
  </script>
</body>
</html>
